<meta name="description" content="Beverly de Jesus — 'Granny Bev' — offers warm, reliable nanny, newborn, and pet care across New York City, with over 30 years of experience and CPR certification.">

<style>
  :root{
    --bg:#F1F4EC;
    --bg-deep:#E9EFE0;
    --surface:#FFFFFF;
    --surface-honey:#FBF4E4;
    --primary:#3C7D5A;
    --primary-deep:#2C5E43;
    --accent:#F2B33D;
    --accent-deep:#CF8E12;
    --blush:#E08A84;
    --ink:#21302A;
    --body:#4C544C;
    --muted:#7E867C;
    --line:#E0E6D7;
    --line-strong:#CdD6C5;
    --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
    --font-body:'Nunito Sans',system-ui,-apple-system,Segoe UI,sans-serif;
    --shadow-sm:0 2px 10px rgba(33,48,42,.06);
    --shadow:0 14px 36px -18px rgba(33,48,42,.28);
    --shadow-lift:0 22px 48px -20px rgba(33,48,42,.34);
    --radius:22px;
    --radius-sm:14px;
    --maxw:1140px;
    --pad:clamp(20px,5vw,40px);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--body);
    font-family:var(--font-body);
    font-size:clamp(16px,1.05vw,17.5px);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink);line-height:1.12;margin:0;font-weight:700;letter-spacing:-.01em;}
  p{margin:0 0 1em;}
  a{color:var(--primary-deep);text-decoration:none;}
  img,svg{display:block;}
  ::selection{background:var(--accent);color:var(--ink);}

  .wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad);}
  .eyebrow{
    font-family:var(--font-body);font-weight:700;text-transform:uppercase;
    letter-spacing:.16em;font-size:.74rem;color:var(--primary-deep);
    display:inline-flex;align-items:center;gap:.55em;margin-bottom:.9rem;
  }
  .eyebrow::before{content:"";width:26px;height:2px;border-radius:2px;background:var(--accent);}
  .section{padding-block:clamp(64px,9vw,108px);position:relative;}
  .section-head{max-width:660px;margin-bottom:clamp(34px,5vw,52px);}
  .section-head.center{margin-inline:auto;text-align:center;}
  .section-head.center .eyebrow{justify-content:center;}
  .section h2{font-size:clamp(1.9rem,4.4vw,3rem);}
  .section-head p{margin-top:.7rem;font-size:1.06rem;color:var(--body);}

  /* buttons */
  .btn{
    --bg:var(--primary-deep);--fg:#fff;
    display:inline-flex;align-items:center;gap:.5em;justify-content:center;
    font-family:var(--font-display);font-weight:600;font-size:1rem;letter-spacing:.01em;
    background:var(--bg);color:var(--fg);border:2px solid var(--bg);
    padding:.72em 1.4em;border-radius:999px;cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    box-shadow:0 8px 20px -12px rgba(33,48,42,.5);
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -12px rgba(33,48,42,.5);}
  .btn:active{transform:translateY(0);}
  .btn.honey{--bg:var(--accent);--fg:var(--ink);border-color:var(--accent);box-shadow:0 10px 22px -10px rgba(207,142,18,.6);}
  .btn.ghost{--bg:transparent;--fg:var(--primary-deep);border-color:var(--line-strong);box-shadow:none;}
  .btn.ghost:hover{background:var(--surface);border-color:var(--primary);}
  .btn svg{width:1.15em;height:1.15em;}

  :focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:6px;}

  /* ---------- NAV ---------- */
  .nav{
    position:sticky;top:0;z-index:50;
    background:rgba(241,244,236,.82);backdrop-filter:blur(12px);
    border-bottom:1px solid transparent;transition:border-color .3s, box-shadow .3s;
  }
  .nav.scrolled{border-color:var(--line);box-shadow:0 4px 20px -16px rgba(33,48,42,.5);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.7rem;}
  .brand{display:flex;align-items:center;gap:.6rem;font-family:var(--font-display);font-weight:800;color:var(--ink);font-size:1.12rem;line-height:1.05;letter-spacing:-.02em;}
  .brand .mark{flex:none;width:42px;height:42px;}
  .brand small{display:block;font-family:var(--font-body);font-weight:700;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--primary-deep);}
  .nav-links{display:flex;align-items:center;gap:.3rem;}
  .nav-links a{
    font-family:var(--font-body);font-weight:600;color:var(--ink);font-size:.96rem;
    padding:.5em .8em;border-radius:999px;transition:background .15s,color .15s;
  }
  .nav-links a:hover{background:var(--bg-deep);color:var(--primary-deep);}
  .nav-cta{margin-left:.4rem;padding:.55em 1.1em;font-size:.95rem;}
  .nav-toggle{display:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;width:46px;height:44px;cursor:pointer;align-items:center;justify-content:center;}
  .nav-toggle svg{width:24px;height:24px;color:var(--ink);}

  @media (max-width:880px){
    .nav-links{
      position:absolute;top:calc(100% + 10px);right:var(--pad);left:var(--pad);
      flex-direction:column;align-items:stretch;gap:.2rem;
      background:var(--surface);border:1px solid var(--line);border-radius:20px;
      padding:.7rem;box-shadow:var(--shadow);
      transform-origin:top;transform:scaleY(.9);opacity:0;visibility:hidden;transition:.2s;
    }
    .nav-links.open{transform:none;opacity:1;visibility:visible;}
    .nav-links a{padding:.7em .9em;}
    .nav-cta{margin:.3rem 0 0;text-align:center;}
    .nav-toggle{display:inline-flex;}
  }

  /* ---------- HERO ---------- */
  .hero{position:relative;padding-top:clamp(40px,6vw,72px);padding-bottom:clamp(56px,8vw,96px);overflow:hidden;}
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(32px,5vw,64px);align-items:center;}
  .hero-copy h1{font-size:clamp(2.4rem,5.6vw,4rem);font-weight:800;letter-spacing:-.02em;}
  .hero-copy h1 .leaf-word{color:var(--primary);white-space:nowrap;}
  .hero-copy h1 .paw-word{color:var(--accent-deep);white-space:nowrap;}
  .hero-lede{font-size:clamp(1.05rem,1.4vw,1.2rem);max-width:36ch;margin-top:1.2rem;}
  .hero-actions{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.8rem;}
  .hero-chips{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2rem;}
  .chip{
    display:inline-flex;align-items:center;gap:.5em;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:.5em .95em;
    font-size:.86rem;font-weight:700;color:var(--ink);box-shadow:var(--shadow-sm);
  }
  .chip svg{width:1.1em;height:1.1em;color:var(--primary);}

  /* hero portrait */
  .hero-art{position:relative;display:grid;place-items:center;min-height:360px;}
  .blob{position:absolute;inset:0;margin:auto;width:min(420px,92%);height:auto;filter:drop-shadow(0 30px 50px -28px rgba(44,94,67,.5));}
  .portrait{
    position:relative;width:min(300px,72%);aspect-ratio:1;border-radius:50%;
    background:linear-gradient(150deg,#fff,var(--surface-honey));
    border:6px solid #fff;box-shadow:var(--shadow-lift);
    display:grid;place-items:center;overflow:hidden;z-index:2;
  }
  .portrait .initials{font-family:var(--font-display);font-weight:800;font-size:clamp(3rem,9vw,4.6rem);color:var(--primary);letter-spacing:-.03em;line-height:1;}
  .portrait .sub{position:absolute;bottom:18%;font-weight:700;font-size:.8rem;color:var(--muted);letter-spacing:.04em;}
  .portrait img{width:100%;height:100%;object-fit:cover;}
  .float-badge{
    position:absolute;z-index:3;background:#fff;border-radius:16px;padding:.55em .8em;
    box-shadow:var(--shadow);display:flex;align-items:center;gap:.5em;font-weight:700;font-size:.84rem;color:var(--ink);
    border:1px solid var(--line);
  }
  .float-badge svg{width:1.3em;height:1.3em;}
  .badge-paw{top:8%;left:-2%;color:var(--accent-deep);}
  .badge-heart{bottom:12%;right:-3%;color:var(--blush);}
  .deco{position:absolute;color:var(--accent);opacity:.9;z-index:1;}
  .deco.d1{top:4%;right:14%;width:46px;color:var(--accent);}
  .deco.d2{bottom:2%;left:6%;width:40px;color:var(--primary);opacity:.7;}

  @media (max-width:860px){
    .hero-grid{grid-template-columns:1fr;}
    .hero-art{order:-1;min-height:320px;}
    .hero-lede{max-width:48ch;}
  }

  /* organic divider */
  .leaf-strip{display:flex;align-items:center;gap:.8rem;color:var(--primary);opacity:.8;margin-top:.4rem;}
  .leaf-strip svg{width:20px;height:20px;}
  .leaf-strip span{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line-strong),transparent);}

  /* ---------- ABOUT ---------- */
  .about{background:var(--surface);border-block:1px solid var(--line);}
  .about-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(32px,5vw,64px);align-items:center;}
  .about-card{
    background:linear-gradient(160deg,var(--bg-deep),var(--surface-honey));
    border-radius:var(--radius);padding:clamp(26px,4vw,40px);border:1px solid var(--line);position:relative;overflow:hidden;
  }
  .about-card .quote-mark{font-family:var(--font-display);font-weight:800;font-size:5rem;color:var(--accent);line-height:.6;opacity:.5;}
  .about-card blockquote{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.32rem;color:var(--ink);line-height:1.3;}
  .about-card cite{display:block;margin-top:1rem;font-style:normal;font-weight:700;color:var(--primary-deep);font-size:.95rem;}
  .about-body p{font-size:1.07rem;}
  .about-body .lead{font-size:1.2rem;color:var(--ink);font-weight:600;font-family:var(--font-display);line-height:1.4;}
  @media (max-width:820px){.about-grid{grid-template-columns:1fr;}.about-card{order:2;}}

  /* ---------- SERVICES ---------- */
  .svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.2vw,24px);}
  .svc{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:clamp(22px,2.6vw,30px);position:relative;overflow:hidden;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .svc:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--line-strong);}
  .svc::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:var(--bg-deep);opacity:.6;transition:transform .3s;z-index:0;}
  .svc:hover::after{transform:scale(1.25);}
  .svc>*{position:relative;z-index:1;}
  .svc .ico{
    width:54px;height:54px;border-radius:16px;display:grid;place-items:center;margin-bottom:1rem;
    background:var(--surface-honey);color:var(--primary-deep);border:1px solid #F0E4C8;
  }
  .svc:nth-child(3n+2) .ico{background:#E7F0E5;border-color:#D3E5Cf;}
  .svc:nth-child(3n) .ico{background:#FBE9E6;border-color:#F3D8D4;color:var(--blush);}
  .svc .ico svg{width:28px;height:28px;stroke-width:1.8;}
  .svc h3{font-size:1.22rem;margin-bottom:.4rem;}
  .svc p{font-size:.98rem;margin:0;color:var(--body);}
  @media (max-width:900px){.svc-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.svc-grid{grid-template-columns:1fr;}}

  /* ---------- CHILDREN ---------- */
  .kids-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.2vw,24px);}
  .kid-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:clamp(22px,2.6vw,30px);transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .kid-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--line-strong);}
  .kid-ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;margin-bottom:1rem;background:#E7F0E5;border:1px solid #D3E5Cf;color:var(--primary-deep);}
  .kid-ico svg{width:28px;height:28px;stroke-width:1.8;}
  .kid-label{font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:1.18rem;line-height:1.2;}
  .kid-duties{margin:.4rem 0 0;font-size:.98rem;color:var(--body);}
  @media (max-width:900px){.kids-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.kids-grid{grid-template-columns:1fr;}}

  /* ---------- PETS ---------- */
  .pets-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.2vw,24px);}
  .pet-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .pet-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--line-strong);}
  .pet-photo{aspect-ratio:4/3;width:100%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(160deg,var(--bg-deep),var(--surface-honey));}
  .pet-photo img{width:100%;height:100%;object-fit:cover;}
  .pet-photo svg{width:52px;height:52px;color:var(--primary);opacity:.45;}
  .pet-body{padding:clamp(14px,2vw,18px) clamp(16px,2.2vw,20px);}
  .pet-name{font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:1.12rem;line-height:1.2;}
  .pet-note{margin:.3rem 0 0;font-size:.95rem;color:var(--body);}
  .pets-note{max-width:62ch;margin:clamp(28px,4vw,40px) auto 0;text-align:center;font-size:.95rem;color:var(--muted);}
  .pets-note:empty{display:none;}
  @media (max-width:900px){.pets-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.pets-grid{grid-template-columns:1fr;}}

  /* ---------- EXPERIENCE TIMELINE ---------- */
  .experience{background:var(--bg-deep);border-block:1px solid var(--line);}
  .timeline{position:relative;max-width:760px;margin-inline:auto;padding-left:30px;}
  .timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--primary),var(--accent));border-radius:2px;}
  .tl-item{position:relative;padding:0 0 clamp(26px,3.4vw,38px) clamp(14px,2vw,26px);}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{content:"";position:absolute;left:-30px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--primary);box-shadow:0 0 0 4px var(--bg-deep);}
  .tl-item.cur::before{background:var(--accent);border-color:var(--accent-deep);}
  .tl-years{font-family:var(--font-display);font-weight:700;color:var(--primary-deep);font-size:.92rem;letter-spacing:.02em;}
  .tl-item h3{font-size:1.18rem;margin:.15rem 0 .1rem;}
  .tl-where{font-weight:700;color:var(--ink);}
  .tl-loc{display:inline-flex;align-items:center;gap:.35em;color:var(--muted);font-size:.85rem;font-weight:600;margin-left:.2rem;}
  .tl-loc svg{width:.95em;height:.95em;}
  .tl-item p{margin:.35rem 0 0;font-size:.98rem;}

  /* ---------- SKILLS ---------- */
  .skills-grid{display:grid;grid-template-columns:1.3fr .9fr;gap:clamp(24px,4vw,48px);align-items:start;}
  .pill-wrap{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.4rem;}
  .pill{
    display:inline-flex;align-items:center;gap:.5em;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:.55em 1.05em;font-weight:700;color:var(--ink);font-size:.95rem;box-shadow:var(--shadow-sm);
  }
  .pill svg{width:1.05em;height:1.05em;color:var(--primary);}
  .pill.star{background:var(--accent);border-color:var(--accent);color:var(--ink);}
  .pill.star svg{color:var(--ink);}
  .edu{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(22px,3vw,30px);box-shadow:var(--shadow-sm);}
  .edu h3{font-size:1.05rem;text-transform:uppercase;letter-spacing:.1em;color:var(--primary-deep);font-family:var(--font-body);font-weight:700;margin-bottom:1rem;font-size:.82rem;}
  .edu-item{padding:.7rem 0;border-top:1px solid var(--line);}
  .edu-item:first-of-type{border-top:0;padding-top:0;}
  .edu-item strong{display:block;color:var(--ink);font-family:var(--font-display);font-size:1.02rem;}
  .edu-item span{font-size:.9rem;color:var(--muted);}
  @media (max-width:780px){.skills-grid{grid-template-columns:1fr;}}

  /* ---------- TESTIMONIAL ---------- */
  .testimonial{background:linear-gradient(165deg,var(--primary-deep),#27543C);color:#EAF1E7;position:relative;overflow:hidden;}
  .testimonial::before,.testimonial::after{content:"";position:absolute;border-radius:50%;background:rgba(242,179,61,.16);}
  .testimonial::before{width:280px;height:280px;top:-120px;right:-60px;}
  .testimonial::after{width:200px;height:200px;bottom:-90px;left:-40px;background:rgba(255,255,255,.06);}
  .testimonial .wrap{position:relative;z-index:1;max-width:880px;text-align:center;}
  .testimonial .eyebrow{color:var(--accent);justify-content:center;}
  .testimonial .eyebrow::before{background:var(--accent);}
  .t-quote{font-family:var(--font-display);font-weight:600;font-size:clamp(1.3rem,2.8vw,2rem);line-height:1.35;color:#fff;margin:0 auto;max-width:24ch;}
  .t-quote .hl{color:var(--accent);}
  .t-quote.full{font-size:clamp(1.15rem,2vw,1.45rem);max-width:46ch;font-weight:500;line-height:1.45;}
  .t-author{margin-top:1.6rem;font-weight:700;color:#EAF1E7;}
  .t-author span{display:block;font-weight:600;color:rgba(234,241,231,.7);font-size:.9rem;margin-top:.2rem;}
  .t-stars{display:flex;gap:.25rem;justify-content:center;margin-bottom:1.4rem;color:var(--accent);}
  .t-stars svg{width:22px;height:22px;}
  .t-note{margin-top:1.8rem;font-size:.92rem;color:rgba(234,241,231,.72);}

  /* ---------- CONTACT ---------- */
  .contact-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(28px,4vw,56px);align-items:start;}
  .contact-cards{display:flex;flex-direction:column;gap:.9rem;margin-top:1.6rem;}
  .ccard{display:flex;align-items:center;gap:1rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:1rem 1.15rem;transition:border-color .2s, transform .2s;box-shadow:var(--shadow-sm);}
  .ccard:hover{border-color:var(--primary);transform:translateX(3px);}
  .ccard .ico{flex:none;width:46px;height:46px;border-radius:12px;background:var(--surface-honey);color:var(--primary-deep);display:grid;place-items:center;border:1px solid #F0E4C8;}
  .ccard .ico svg{width:22px;height:22px;stroke-width:1.8;}
  .ccard .lbl{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:.12rem;}

        '<div class="field"><label for="cf-name">' + esc(f.nameLabel) + '</label>' +
          '<input id="cf-name" name="name" type="text" placeholder="' + esc(f.namePlaceholder) + '" required></div>' +
        '<div class="field"><label for="cf-contact">' + esc(f.contactLabel) + '</label>' +
          '<input id="cf-contact" name="contact" type="text" placeholder="' + esc(f.contactPlaceholder) + '" required></div>' +
        '<div class="field"><label for="cf-msg">' + esc(f.messageLabel) + '</label>' +
          '<textarea id="cf-msg" name="message" placeholder="' + esc(f.messagePlaceholder) + '" required></textarea></div>' +
        '<button class="btn honey" type="submit">' + esc(f.buttonText) + ' ' + ICONS.arrow + '</button>' +
        (f.note ? '<p class="form-note">' + esc(f.note) + '</p>' : '') +
      '</form>';
    set('contactGrid', left + form);
  }

  function renderFooter(f, brand){
    var mark = '<svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="17" fill="#3C7D5A"/><path d="M22 18V46M22 18H34a7 7 0 0 1 0 14H22M22 32H35a7 7 0 0 1 0 14H22" fill="none" stroke="#FBF4E4" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(41,10) scale(0.32)" fill="#F2B33D"><path d="M16 29C16 29 3 20 3 11C3 6 7 3 11 3C14 3 16 6 16 7C16 6 18 3 21 3C25 3 29 6 29 11C29 20 16 29 16 29Z"/></g></svg>';
    set('footerTop',
      '<div>' +
        '<a class="brand" href="#top">' + mark + '<span>' + brandSpan(brand) + '</span></a>' +
        '<p class="footer-tag">' + esc(f.tagline) + '</p>' +
      '</div>' +
      '<div class="footer-contact">' +
        '<a href="' + esc(f.phoneHref) + '">' + esc(f.phone) + '</a>' +
        '<a href="mailto:' + esc(f.email) + '">' + esc(f.email) + '</a>' +
        '<span style="color:#A7B2A6">' + esc(f.location) + '</span>' +
      '</div>');
    set('footerCopyright', '© ' + new Date().getFullYear() + ' ' + esc(f.copyrightName));
    set('footerMade', esc(f.madeWith).replace('♥', '<span class="heart">♥</span>'));
  }

  /* ---------- interactions (run after content is in the DOM) ---------- */
  function initInteractions(){
    var toggle = el('navToggle');
    var links = el('navlinks');
    if (toggle && links){
      toggle.addEventListener('click', function (){
        var open = links.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open);
        toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      });
      links.querySelectorAll('a').forEach(function (a){
        a.addEventListener('click', function (){
          links.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        });
      });
    }

    var nav = el('nav');
    if (nav){
      var onScroll = function (){ nav.classList.toggle('scrolled', window.scrollY > 8); };
      onScroll();
      window.addEventListener('scroll', onScroll, { passive: true });
    }

    var io = new IntersectionObserver(function (entries){
      entries.forEach(function (e){ if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal').forEach(function (n){ io.observe(n); });

    var form = el('contactForm');
    if (form){
      form.addEventListener('submit', function (e){
        e.preventDefault();
        var to = form.getAttribute('data-email') || '';
        var name = (form.elements['name'].value || '').trim();
        var contact = (form.elements['contact'].value || '').trim();
        var msg = (form.elements['message'].value || '').trim();
        var subject = encodeURIComponent('Nanny / pet care inquiry — ' + (name || 'New family'));
        var body = encodeURIComponent('Hi Beverly,\n\n' + msg + '\n\n— ' + name + '\nReach me at: ' + contact);
        window.location.href = 'mailto:' + to + '?subject=' + subject + '&body=' + body;
      });
    }
  }

  function showError(msg){
    var box = el('loadError');
    if (box){ box.style.display = 'block'; box.querySelector('.le-msg').textContent = msg; }
  }

  function render(content){
    renderMeta(content.site || {});
    set('brandText', brandSpan(content.brand || {}));
    renderHero(content.hero || {});
    renderAbout(content.about || {});
    renderServices(content.services || {});
    renderExperience(content.experience || {});
    renderChildren(content.children || {});
    renderPets(content.pets || {});
    renderSkills(content.skills || {});
    renderTestimonial(content.testimonial || {});
    renderContact(content.contact || {});
    renderFooter(content.footer || {}, content.brand || {});
    initInteractions();
  }

  fetch('content.json', { cache: 'no-cache' })
    .then(function (r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (content){
      try { render(content); }
      catch (err){ console.error('Render error:', err); showError('Something in content.json couldn’t be displayed: ' + err.message); }
    })
    .catch(function (err){
      console.error('Could not load content.json:', err);
      showError(location.protocol === 'file:'
        ? 'This page reads its text from content.json, which browsers block when a file is opened directly. Run a local server (see README.md) or view the published site — both work fine.'
        : 'Could not load content.json (' + err.message + '). Make sure the file is alongside index.html and contains valid JSON.');
    });
})();
</script>
</body>
</html>
