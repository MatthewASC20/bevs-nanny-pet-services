<meta name="description" content="Beverly de Jesus — 'Granny Bev' — offers warm, reliable nanny, newborn, and pet care across New York City, with over 30 years of experience and CPR certification.">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F4EC;
    --bg-deep:#E9EFE0;
    --surface:#FFFFFF;
    --surface-honey:#FBF4E4;
    --primary:#3C7D5A;
    --primary-deep:#2C5E43;
    --accent:#F2B33D;
    --accent-deep:#CF8E12;
    --blush:#E08A84;
    --ink:#21302A;
    --body:#4C544C;
    --muted:#7E867C;
    --line:#E0E6D7;
    --line-strong:#CdD6C5;
    --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
    --font-body:'Nunito Sans',system-ui,-apple-system,Segoe UI,sans-serif;
    --shadow-sm:0 2px 10px rgba(33,48,42,.06);
    --shadow:0 14px 36px -18px rgba(33,48,42,.28);
    --shadow-lift:0 22px 48px -20px rgba(33,48,42,.34);
    --radius:22px;
    --radius-sm:14px;
    --maxw:1140px;
    --pad:clamp(20px,5vw,40px);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--body);
    font-family:var(--font-body);
    font-size:clamp(16px,1.05vw,17.5px);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink);line-height:1.12;margin:0;font-weight:700;letter-spacing:-.01em;}
  p{margin:0 0 1em;}
  a{color:var(--primary-deep);text-decoration:none;}
  img,svg{display:block;}
  ::selection{background:var(--accent);color:var(--ink);}

  .wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad);}
  .eyebrow{
    font-family:var(--font-body);font-weight:700;text-transform:uppercase;
    letter-spacing:.16em;font-size:.74rem;color:var(--primary-deep);
    display:inline-flex;align-items:center;gap:.55em;margin-bottom:.9rem;
  }
  .eyebrow::before{content:"";width:26px;height:2px;border-radius:2px;background:var(--accent);}
  .section{padding-block:clamp(64px,9vw,108px);position:relative;}
  .section-head{max-width:660px;margin-bottom:clamp(34px,5vw,52px);}
  .section-head.center{margin-inline:auto;text-align:center;}
  .section-head.center .eyebrow{justify-content:center;}
  .section h2{font-size:clamp(1.9rem,4.4vw,3rem);}
  .section-head p{margin-top:.7rem;font-size:1.06rem;color:var(--body);}

  /* buttons */
  .btn{
    --bg:var(--primary-deep);--fg:#fff;
    display:inline-flex;align-items:center;gap:.5em;justify-content:center;
    font-family:var(--font-display);font-weight:600;font-size:1rem;letter-spacing:.01em;
    background:var(--bg);color:var(--fg);border:2px solid var(--bg);
    padding:.72em 1.4em;border-radius:999px;cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    box-shadow:0 8px 20px -12px rgba(33,48,42,.5);
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -12px rgba(33,48,42,.5);}
  .btn:active{transform:translateY(0);}
  .btn.honey{--bg:var(--accent);--fg:var(--ink);border-color:var(--accent);box-shadow:0 10px 22px -10px rgba(207,142,18,.6);}
  .btn.ghost{--bg:transparent;--fg:var(--primary-deep);border-color:var(--line-strong);box-shadow:none;}
  .btn.ghost:hover{background:var(--surface);border-color:var(--primary);}
  .btn svg{width:1.15em;height:1.15em;}

  :focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:6px;}

  /* ---------- NAV ---------- */
  .nav{
    position:sticky;top:0;z-index:50;
    background:rgba(241,244,236,.82);backdrop-filter:blur(12px);
    border-bottom:1px solid transparent;transition:border-color .3s, box-shadow .3s;
  }
  .nav.scrolled{border-color:var(--line);box-shadow:0 4px 20px -16px rgba(33,48,42,.5);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.7rem;}
  .brand{display:flex;align-items:center;gap:.6rem;font-family:var(--font-display);font-weight:800;color:var(--ink);font-size:1.12rem;line-height:1.05;letter-spacing:-.02em;}
  .brand .mark{flex:none;width:42px;height:42px;}
  .brand small{display:block;font-family:var(--font-body);font-weight:700;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--primary-deep);}
  .nav-links{display:flex;align-items:center;gap:.3rem;}
  .nav-links a{
    font-family:var(--font-body);font-weight:600;color:var(--ink);font-size:.96rem;
    padding:.5em .8em;border-radius:999px;transition:background .15s,color .15s;
  }
  .nav-links a:hover{background:var(--bg-deep);color:var(--primary-deep);}
  .nav-cta{margin-left:.4rem;padding:.55em 1.1em;font-size:.95rem;}
  .nav-toggle{display:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;width:46px;height:44px;cursor:pointer;align-items:center;justify-content:center;}
  .nav-toggle svg{width:24px;height:24px;color:var(--ink);}

  @media (max-width:880px){
    .nav-links{
      position:absolute;top:calc(100% + 10px);right:var(--pad);left:var(--pad);
      flex-direction:column;align-items:stretch;gap:.2rem;
      background:var(--surface);border:1px solid var(--line);border-radius:20px;
      padding:.7rem;box-shadow:var(--shadow);
      transform-origin:top;transform:scaleY(.9);opacity:0;visibility:hidden;transition:.2s;
    }
    .nav-links.open{transform:none;opacity:1;visibility:visible;}
    .nav-links a{padding:.7em .9em;}
    .nav-cta{margin:.3rem 0 0;text-align:center;}
    .nav-toggle{display:inline-flex;}
  }

  /* ---------- HERO ---------- */
  .hero{position:relative;padding-top:clamp(40px,6vw,72px);padding-bottom:clamp(56px,8vw,96px);overflow:hidden;}
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(32px,5vw,64px);align-items:center;}
  .hero-copy h1{font-size:clamp(2.4rem,5.6vw,4rem);font-weight:800;letter-spacing:-.02em;}
  .hero-copy h1 .leaf-word{color:var(--primary);white-space:nowrap;}
  .hero-copy h1 .paw-word{color:var(--accent-deep);white-space:nowrap;}
  .hero-lede{font-size:clamp(1.05rem,1.4vw,1.2rem);max-width:36ch;margin-top:1.2rem;}
  .hero-actions{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.8rem;}
  .hero-chips{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2rem;}
  .chip{
    display:inline-flex;align-items:center;gap:.5em;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:.5em .95em;
    font-size:.86rem;font-weight:700;color:var(--ink);box-shadow:var(--shadow-sm);
  }
  .chip svg{width:1.1em;height:1.1em;color:var(--primary);}

  /* hero portrait */
  .hero-art{position:relative;display:grid;place-items:center;min-height:360px;}
  .blob{position:absolute;inset:0;margin:auto;width:min(420px,92%);height:auto;filter:drop-shadow(0 30px 50px -28px rgba(44,94,67,.5));}
  .portrait{
    position:relative;width:min(300px,72%);aspect-ratio:1;border-radius:50%;
    background:linear-gradient(150deg,#fff,var(--surface-honey));
    border:6px solid #fff;box-shadow:var(--shadow-lift);
    display:grid;place-items:center;overflow:hidden;z-index:2;
  }
  .portrait .initials{font-family:var(--font-display);font-weight:800;font-size:clamp(3rem,9vw,4.6rem);color:var(--primary);letter-spacing:-.03em;line-height:1;}
  .portrait .sub{position:absolute;bottom:18%;font-weight:700;font-size:.8rem;color:var(--muted);letter-spacing:.04em;}
  .portrait img{width:100%;height:100%;object-fit:cover;}
  .float-badge{
    position:absolute;z-index:3;background:#fff;border-radius:16px;padding:.55em .8em;
    box-shadow:var(--shadow);display:flex;align-items:center;gap:.5em;font-weight:700;font-size:.84rem;color:var(--ink);
    border:1px solid var(--line);
  }
  .float-badge svg{width:1.3em;height:1.3em;}
  .badge-paw{top:8%;left:-2%;color:var(--accent-deep);}
  .badge-heart{bottom:12%;right:-3%;color:var(--blush);}
  .deco{position:absolute;color:var(--accent);opacity:.9;z-index:1;}
  .deco.d1{top:4%;right:14%;width:46px;color:var(--accent);}
  .deco.d2{bottom:2%;left:6%;width:40px;color:var(--primary);opacity:.7;}

  @media (max-width:860px){
    .hero-grid{grid-template-columns:1fr;}
    .hero-art{order:-1;min-height:320px;}
    .hero-lede{max-width:48ch;}
  }

  /* organic divider */
  .leaf-strip{display:flex;align-items:center;gap:.8rem;color:var(--primary);opacity:.8;margin-top:.4rem;}
  .leaf-strip svg{width:20px;height:20px;}
  .leaf-strip span{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line-strong),transparent);}

  /* ---------- ABOUT ---------- */
  .about{background:var(--surface);border-block:1px solid var(--line);}
  .about-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(32px,5vw,64px);align-items:center;}
  .about-card{
    background:linear-gradient(160deg,var(--bg-deep),var(--surface-honey));
    border-radius:var(--radius);padding:clamp(26px,4vw,40px);border:1px solid var(--line);position:relative;overflow:hidden;
  }
  .about-card .quote-mark{font-family:var(--font-display);font-weight:800;font-size:5rem;color:var(--accent);line-height:.6;opacity:.5;}
  .about-card blockquote{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.32rem;color:var(--ink);line-height:1.3;}
  .about-card cite{display:block;margin-top:1rem;font-style:normal;font-weight:700;color:var(--primary-deep);font-size:.95rem;}
  .about-body p{font-size:1.07rem;}
  .about-body .lead{font-size:1.2rem;color:var(--ink);font-weight:600;font-family:var(--font-display);line-height:1.4;}
  @media (max-width:820px){.about-grid{grid-template-columns:1fr;}.about-card{order:2;}}

  /* ---------- SERVICES ---------- */
  .svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.2vw,24px);}
  .svc{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:clamp(22px,2.6vw,30px);position:relative;overflow:hidden;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .svc:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--line-strong);}
  .svc::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:var(--bg-deep);opacity:.6;transition:transform .3s;z-index:0;}
  .svc:hover::after{transform:scale(1.25);}
  .svc>*{position:relative;z-index:1;}
  .svc .ico{
    width:54px;height:54px;border-radius:16px;display:grid;place-items:center;margin-bottom:1rem;
    background:var(--surface-honey);color:var(--primary-deep);border:1px solid #F0E4C8;
  }
  .svc:nth-child(3n+2) .ico{background:#E7F0E5;border-color:#D3E5Cf;}
  .svc:nth-child(3n) .ico{background:#FBE9E6;border-color:#F3D8D4;color:var(--blush);}
  .svc .ico svg{width:28px;height:28px;stroke-width:1.8;}
  .svc h3{font-size:1.22rem;margin-bottom:.4rem;}
  .svc p{font-size:.98rem;margin:0;color:var(--body);}
  @media (max-width:900px){.svc-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.svc-grid{grid-template-columns:1fr;}}

  /* ---------- SHOWCASE CARDS (children + pets) ---------- */
  .kids-grid,.pets-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.2vw,24px);}
  .pets{background:var(--bg-deep);border-block:1px solid var(--line);}

  /* children — icon cards (shown when a child has no photo) */
  .kid-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:clamp(22px,2.6vw,30px);transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .kid-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--line-strong);}
  .kid-ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;margin-bottom:1rem;background:#E7F0E5;border:1px solid #D3E5Cf;color:var(--primary-deep);}
  .kid-ico svg{width:28px;height:28px;stroke-width:1.8;}
  .kid-label{font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:1.18rem;line-height:1.2;}
  .kid-duties{margin:.4rem 0 0;font-size:.98rem;color:var(--body);}

  /* photo cards (pets, and any child given a photo) */
  .show-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .show-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--line-strong);}
  .card-photo{position:relative;aspect-ratio:4/3;width:100%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(160deg,var(--bg-deep),var(--surface-honey));}
  .card-photo img{width:100%;height:100%;object-fit:cover;}
  .card-photo>svg{width:52px;height:52px;color:var(--primary);opacity:.45;}
  .card-body{padding:clamp(14px,2vw,18px) clamp(16px,2.2vw,20px);}
  .card-title{font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:1.12rem;line-height:1.2;}
  .card-sub{margin:.3rem 0 0;font-size:.95rem;color:var(--body);}
  .pets-note{max-width:62ch;margin:clamp(28px,4vw,40px) auto 0;text-align:center;font-size:.95rem;color:var(--muted);}
  .pets-note:empty{display:none;}

  /* photo card -> clickable carousel */
  .show-card[data-gallery]{cursor:pointer;}
  .show-card[data-gallery]:focus-visible{outline:3px solid var(--primary);outline-offset:3px;}
  .card-view{position:absolute;inset:0;display:grid;place-items:center;color:#fff;opacity:0;background:rgba(33,48,42,0);transition:opacity .2s ease, background .2s ease;pointer-events:none;}
  .show-card[data-gallery]:hover .card-view,.show-card[data-gallery]:focus-visible .card-view{opacity:1;background:rgba(33,48,42,.28);}
  .card-view svg{width:30px;height:30px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));}
  .card-count{position:absolute;right:10px;bottom:10px;z-index:1;display:inline-flex;align-items:center;gap:.35em;background:rgba(33,48,42,.78);color:#fff;font-size:.78rem;font-weight:700;padding:.3em .6em;border-radius:999px;}
  .card-count svg{width:14px;height:14px;}

  /* lightbox */
  .lightbox{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(20,30,25,.92);padding:clamp(16px,4vw,48px);}
  .lightbox.open{display:flex;}
  .lb-stage{position:relative;display:flex;align-items:center;justify-content:center;width:100%;max-width:980px;}
  .lb-img{max-width:100%;max-height:76vh;border-radius:16px;background:#fff;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);}
  .lb-close,.lb-prev,.lb-next{width:46px;height:46px;border-radius:999px;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .15s ease;}
  .lb-close:hover,.lb-prev:hover,.lb-next:hover{background:rgba(255,255,255,.3);}
  .lb-close{position:absolute;top:clamp(12px,2.5vw,22px);right:clamp(12px,2.5vw,22px);}
  .lb-prev{position:absolute;left:10px;top:50%;transform:translateY(-50%);}
  .lb-next{position:absolute;right:10px;top:50%;transform:translateY(-50%);}
  .lb-close svg,.lb-prev svg,.lb-next svg{width:22px;height:22px;}
  .lb-caption{color:#EAF1E7;font-family:var(--font-display);font-weight:600;font-size:1rem;text-align:center;}
  .lb-dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .lb-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.38);border:0;padding:0;cursor:pointer;transition:background .15s ease, transform .15s ease;}
  .lb-dot:hover{background:rgba(255,255,255,.6);}
  .lb-dot.active{background:var(--accent);transform:scale(1.2);}
  @media (prefers-reduced-motion:reduce){.card-view,.lb-close,.lb-prev,.lb-next,.lb-dot{transition:none;}}
  @media (max-width:900px){.kids-grid,.pets-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.kids-grid,.pets-grid{grid-template-columns:1fr;}}

  /* ---------- EXPERIENCE TIMELINE ---------- */
  .experience{background:var(--bg-deep);border-block:1px solid var(--line);}
  .timeline{position:relative;max-width:760px;margin-inline:auto;padding-left:30px;}
  .timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--primary),var(--accent));border-radius:2px;}
  .tl-item{position:relative;padding:0 0 clamp(26px,3.4vw,38px) clamp(14px,2vw,26px);}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{content:"";position:absolute;left:-30px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--primary);box-shadow:0 0 0 4px var(--bg-deep);}
  .tl-item.cur::before{background:var(--accent);border-color:var(--accent-deep);}
  .tl-years{font-family:var(--font-display);font-weight:700;color:var(--primary-deep);font-size:.92rem;letter-spacing:.02em;}
  .tl-item h3{font-size:1.18rem;margin:.15rem 0 .1rem;}
  .tl-where{font-weight:700;color:var(--ink);}
  .tl-loc{display:inline-flex;align-items:center;gap:.35em;color:var(--muted);font-size:.85rem;font-weight:600;margin-left:.2rem;}
  .tl-loc svg{width:.95em;height:.95em;}
  .tl-item p{margin:.35rem 0 0;font-size:.98rem;}

  /* ---------- SKILLS ---------- */
  .skills-grid{display:grid;grid-template-columns:1.3fr .9fr;gap:clamp(24px,4vw,48px);align-items:start;}
  .pill-wrap{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.4rem;}
  .pill{
    display:inline-flex;align-items:center;gap:.5em;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:.55em 1.05em;font-weight:700;color:var(--ink);font-size:.95rem;box-shadow:var(--shadow-sm);
  }
  .pill svg{width:1.05em;height:1.05em;color:var(--primary);}
  .pill.star{background:var(--accent);border-color:var(--accent);color:var(--ink);}
  .pill.star svg{color:var(--ink);}
  .edu{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(22px,3vw,30px);box-shadow:var(--shadow-sm);}
  .edu h3{font-size:1.05rem;text-transform:uppercase;letter-spacing:.1em;color:var(--primary-deep);font-family:var(--font-body);font-weight:700;margin-bottom:1rem;font-size:.82rem;}
  .edu-item{padding:.7rem 0;border-top:1px solid var(--line);}
  .edu-item:first-of-type{border-top:0;padding-top:0;}
  .edu-item strong{display:block;color:var(--ink);font-family:var(--font-display);font-size:1.02rem;}

  @media (max-width:780px){.skills-grid{grid-template-columns:1fr;}}

  /* ---------- TESTIMONIAL ---------- */
  .testimonial{background:linear-gradient(165deg,var(--primary-deep),#27543C);color:#EAF1E7;position:relative;overflow:hidden;}

  .testimonial::before{width:280px;height:280px;top:-120px;right:-60px;}
  .testimonial::after{width:200px;height:200px;bottom:-90px;left:-40px;background:rgba(255,255,255,.06);}
  .testimonial .wrap{position:relative;z-index:1;max-width:880px;text-align:center;}
  .testimonial .eyebrow{color:var(--accent);justify-content:center;}
  .testimonial .eyebrow::before{background:var(--accent);}
  .t-quote{font-family:var(--font-display);font-weight:600;font-size:clamp(1.3rem,2.8vw,2rem);line-height:1.35;color:#fff;margin:0 auto;max-width:24ch;}
  .t-quote .hl{color:var(--accent);}
  .t-quote.full{font-size:clamp(1.15rem,2vw,1.45rem);max-width:46ch;font-weight:500;line-height:1.45;}
  .t-author{margin-top:1.6rem;font-weight:700;color:#EAF1E7;}
  .t-author span{display:block;font-weight:600;color:rgba(234,241,231,.7);font-size:.9rem;margin-top:.2rem;}
  .t-stars{display:flex;gap:.25rem;justify-content:center;margin-bottom:1.4rem;color:var(--accent);}
  .t-stars svg{width:22px;height:22px;}
  .t-note{margin-top:1.8rem;font-size:.92rem;color:rgba(234,241,231,.72);}

  /* ---------- CONTACT ---------- */
  .contact-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(28px,4vw,56px);align-items:start;}
  .contact-cards{display:flex;flex-direction:column;gap:.9rem;margin-top:1.6rem;}
  .ccard{display:flex;align-items:center;gap:1rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:1rem 1.15rem;transition:border-color .2s, transform .2s;box-shadow:var(--shadow-sm);}
  .ccard:hover{border-color:var(--primary);transform:translateX(3px);}
  .ccard .ico{flex:none;width:46px;height:46px;border-radius:12px;background:var(--surface-honey);color:var(--primary-deep);display:grid;place-items:center;border:1px solid #F0E4C8;}
  .ccard .ico svg{width:22px;height:22px;stroke-width:1.8;}
  .ccard .lbl{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:.12rem;}
  .ccard .val{display:block;font-family:var(--font-display);font-weight:600;color:var(--ink);font-size:1.05rem;line-height:1.2;}
  .form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(24px,3vw,34px);box-shadow:var(--shadow);}
  .form h3{font-size:1.3rem;margin-bottom:.3rem;}
  .form p.f-sub{font-size:.95rem;color:var(--muted);margin-bottom:1.2rem;}
  .field{margin-bottom:1rem;}
  .field label{display:block;font-weight:700;font-size:.85rem;color:var(--ink);margin-bottom:.35rem;}
  .field input,.field textarea{
    width:100%;font-family:var(--font-body);font-size:1rem;color:var(--ink);
    background:var(--bg);border:1.5px solid var(--line-strong);border-radius:12px;padding:.7em .9em;transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(60,125,90,.16);}
  .field textarea{resize:vertical;min-height:104px;}
  .form .btn{width:100%;margin-top:.4rem;}
  .form-note{font-size:.82rem;color:var(--muted);margin:.9rem 0 0;text-align:center;}
  .hp-field{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden;opacity:0;}
  .form-sent{text-align:center;padding:clamp(8px,3vw,22px) 0;}
  .form-sent svg{width:54px;height:54px;color:var(--primary);margin:0 auto .7rem;}
  .form-sent h3{font-size:1.3rem;margin-bottom:.4rem;}
  .form-sent p{color:var(--body);margin:0;}

  /* ---------- PAYMENT ---------- */
  .pay{background:var(--surface);border-block:1px solid var(--line);}
  .pay-card{
    max-width:560px;margin-inline:auto;text-align:center;
    background:linear-gradient(160deg,var(--bg-deep),var(--surface-honey));
    border:1px solid var(--line);border-radius:var(--radius);
    padding:clamp(28px,5vw,46px);box-shadow:var(--shadow-sm);
  }
  .pay-card .eyebrow{justify-content:center;}
  .pay-card h2{font-size:clamp(1.5rem,3.2vw,2.1rem);}
  .pay-blurb{margin:.7rem auto 1.5rem;max-width:42ch;color:var(--body);font-size:1.04rem;}
  .pay-card .btn{font-size:1.05rem;padding:.8em 1.7em;}
  .pay-secure{margin:1.1rem auto 0;display:flex;align-items:center;justify-content:center;gap:.45em;max-width:46ch;font-size:.82rem;color:var(--muted);font-weight:600;line-height:1.4;}
  .pay-secure svg{width:1.1em;height:1.1em;flex:none;color:var(--primary);}
  @media (max-width:820px){.contact-grid{grid-template-columns:1fr;}}

  /* ---------- FOOTER ---------- */
  .footer{background:var(--ink);color:#C9D2C7;padding-block:clamp(40px,5vw,56px) 28px;}
  .footer-top{display:flex;flex-wrap:wrap;gap:1.5rem 2.5rem;justify-content:space-between;align-items:flex-start;}
  .footer .brand{color:#fff;}
  .footer .brand small{color:var(--accent);}
  .footer-tag{max-width:34ch;font-size:.95rem;color:#A7B2A6;margin-top:.8rem;}
  .footer-contact{display:flex;flex-direction:column;gap:.5rem;font-size:.95rem;}
  .footer-contact a{color:#E7EDE6;font-weight:600;}
  .footer-contact a:hover{color:var(--accent);}
  .footer-bottom{margin-top:2.2rem;padding-top:1.3rem;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;font-size:.84rem;color:#8E998D;}
  .footer-bottom .heart{color:var(--blush);}

  /* reveal animation */
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease, transform .7s ease;}
  .reveal.in{opacity:1;transform:none;}
  .reveal.d1{transition-delay:.08s;}
  .reveal.d2{transition-delay:.16s;}
  .reveal.d3{transition-delay:.24s;}

    .float-anim{animation:none!important;}
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .float-anim{animation:bob 5s ease-in-out infinite;}
  .float-anim.slow{animation-duration:6.5s;}

        '<div class="float-badge badge-paw float-anim">' + icon(b0.icon) + ' ' + esc(b0.text) + '</div>' +
        '<div class="float-badge badge-heart float-anim slow">' + icon(b1.icon) + ' ' + esc(b1.text) + '</div>' +

  function renderAbout(a){

      '<div class="about-card reveal">' +

      '<div class="about-body reveal d1">' +

  function head(d){

           '<h2>' + esc(d.heading) + '</h2>' +
           (d.intro ? '<p>' + esc(d.intro) + '</p>' : '');

  function renderServices(s){
    set('servicesHead', head(s));
    set('servicesGrid', (s.items || []).map(function (it, i){
      return '<article class="svc reveal' + delay(i) + '">' +
        '<div class="ico">' + icon(it.icon) + '</div>' +

  function renderExperience(e){
    set('experienceHead', head(e));

        '<div class="tl-years">' + esc(it.years) + '</div>' +

        '<div><span class="tl-where">' + esc(it.family) + '</span>' + loc + '</div>' +

  function renderChildren(c){
    set('childrenHead', head(c));
    set('childrenGrid', (c.items || []).map(function (it, i){
      var photos = photoPaths(it.folder, it.photos);
      if (photos.length){
        return photoCard({
          gid: 'kid-' + i, photos: photos,
          alt: it.photoAlt || it.label, caption: it.label,

        });
      }

  function renderPets(p){
    set('petsHead', head(p));
    set('petsGrid', (p.items || []).map(function (it, i){
      var photos = photoPaths(it.folder, (it.photos && it.photos.length) ? it.photos : (it.photo ? [it.photo] : []));
      return photoCard({
        gid: 'pet-' + i, photos: photos,

  function renderSkills(s){

    }).join('');

      '<div class="reveal">' +
        '<span class="eyebrow">' + esc(s.eyebrow) + '</span>' +

        (s.intro ? '<p>' + esc(s.intro) + '</p>' : '') +
        '<div class="pill-wrap">' + pills + '</div>' +
      '</div>' +
      '<div class="edu reveal d1">' +
        '<h3>' + esc(s.educationHeading) + '</h3>' + edu +

  function renderTestimonial(t){
    var n = Math.max(0, parseInt(t.stars, 10) || 0);
    var stars = '';
    for (var i = 0; i < n; i++) stars += ICONS.star;
    set('testimonialWrap',
      '<span class="eyebrow">' + esc(t.eyebrow) + '</span>' +
      '<div class="t-stars" aria-label="' + n + ' star reference">' + stars + '</div>' +
      '<p class="t-quote full">“' + rich(t.quote, 'hl') + '”</p>' +
      '<div class="t-author">' + esc(t.author) + '<span>' + esc(t.authorDetail) + '</span></div>' +
      (t.note ? '<p class="t-note">' + esc(t.note) + '</p>' : ''));
  }

  function renderPayment(p){
    var sec = el('pay');
    var url = ((p && p.url) || '').trim();
    if (!/^https?:\/\//i.test(url)){ if (sec) sec.style.display = 'none'; set('payWrap', ''); return; }
    if (sec) sec.style.display = '';
    set('payWrap',
      '<div class="pay-card reveal">' +
        (p.eyebrow ? '<span class="eyebrow">' + esc(p.eyebrow) + '</span>' : '') +
        '<h2>' + esc(p.heading) + '</h2>' +
        (p.blurb ? '<p class="pay-blurb">' + esc(p.blurb) + '</p>' : '') +
        '<a class="btn honey" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(p.buttonText || 'Pay securely') + ' ' + ICONS.lock + '</a>' +
        (p.secureNote ? '<div class="pay-secure">' + ICONS.lock + '<span>' + esc(p.secureNote) + '</span></div>' : '') +
      '</div>'
    );
  }

  function renderContact(c){
    var cards = (c.cards || []).map(function (cd){
      var inner = '<span class="ico">' + icon(cd.icon) + '</span>' +
        '<span><span class="lbl">' + esc(cd.label) + '</span><span class="val">' + esc(cd.value) + '</span></span>';
      return cd.href
        ? '<a class="ccard" href="' + esc(cd.href) + '">' + inner + '</a>'
        : '<div class="ccard" style="cursor:default">' + inner + '</div>';
    }).join('');
    var f = c.form || {};
    var left =
      '<div class="reveal">' +
        '<span class="eyebrow">' + esc(c.eyebrow) + '</span>' +
        '<h2>' + esc(c.heading) + '</h2>' +
        (c.intro ? '<p>' + esc(c.intro) + '</p>' : '') +
        '<div class="contact-cards">' + cards + '</div>' +
      '</div>';
    var form =
      '<form class="form reveal d1" id="contactForm" data-email="' + esc(f.emailTo) + '" data-key="' + esc(f.accessKey || '') + '">' +
        '<h3>' + esc(f.heading) + '</h3>' +
        '<p class="f-sub">' + esc(f.subtext) + '</p>' +
        '<div class="field"><label for="cf-name">' + esc(f.nameLabel) + '</label>' +
          '<input id="cf-name" name="name" type="text" placeholder="' + esc(f.namePlaceholder) + '" required></div>' +
        '<div class="field"><label for="cf-contact">' + esc(f.contactLabel) + '</label>' +
          '<input id="cf-contact" name="contact" type="text" placeholder="' + esc(f.contactPlaceholder) + '" required></div>' +
        '<div class="field"><label for="cf-msg">' + esc(f.messageLabel) + '</label>' +
          '<textarea id="cf-msg" name="message" placeholder="' + esc(f.messagePlaceholder) + '" required></textarea></div>' +
        '<input type="text" name="botcheck" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">' +
        '<button class="btn honey" type="submit">' + esc(f.buttonText) + ' ' + ICONS.arrow + '</button>' +
        (f.note ? '<p class="form-note">' + esc(f.note) + '</p>' : '') +
      '</form>';
    set('contactGrid', left + form);
  }

  function renderFooter(f, brand){
    var mark = '<svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="17" fill="#3C7D5A"/><path d="M22 18V46M22 18H34a7 7 0 0 1 0 14H22M22 32H35a7 7 0 0 1 0 14H22" fill="none" stroke="#FBF4E4" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(41,10) scale(0.32)" fill="#F2B33D"><path d="M16 29C16 29 3 20 3 11C3 6 7 3 11 3C14 3 16 6 16 7C16 6 18 3 21 3C25 3 29 6 29 11C29 20 16 29 16 29Z"/></g></svg>';
    set('footerTop',
      '<div>' +
        '<a class="brand" href="#top">' + mark + '<span>' + brandSpan(brand) + '</span></a>' +
        '<p class="footer-tag">' + esc(f.tagline) + '</p>' +
      '</div>' +
      '<div class="footer-contact">' +
        '<a href="' + esc(f.phoneHref) + '">' + esc(f.phone) + '</a>' +
        '<a href="mailto:' + esc(f.email) + '">' + esc(f.email) + '</a>' +
        '<span style="color:#A7B2A6">' + esc(f.location) + '</span>' +
      '</div>');
    set('footerCopyright', '© ' + new Date().getFullYear() + ' ' + esc(f.copyrightName));
    set('footerMade', esc(f.madeWith).replace('♥', '<span class="heart">♥</span>'));
  }

  /* ---------- pet photo lightbox / carousel ---------- */
  var lb = null;
  function lbChevron(left){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="' + (left ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7') + '"/></svg>';
  }
  function buildLightbox(){
    if (lb) return;
    var box = document.createElement('div');
    box.className = 'lightbox';
    box.id = 'lightbox';
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-label', 'Photo gallery');
    box.setAttribute('aria-hidden', 'true');
    box.innerHTML =
      '<button class="lb-close" type="button" aria-label="Close photos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
      '<div class="lb-stage">' +
        '<button class="lb-prev" type="button" aria-label="Previous photo">' + lbChevron(true) + '</button>' +
        '<img class="lb-img" alt="">' +
        '<button class="lb-next" type="button" aria-label="Next photo">' + lbChevron(false) + '</button>' +
      '</div>' +
      '<div class="lb-caption"></div>' +
      '<div class="lb-dots"></div>';
    document.body.appendChild(box);
    lb = {
      el: box, img: box.querySelector('.lb-img'), stage: box.querySelector('.lb-stage'),
      caption: box.querySelector('.lb-caption'), dots: box.querySelector('.lb-dots'),
      closeBtn: box.querySelector('.lb-close'), prev: box.querySelector('.lb-prev'), next: box.querySelector('.lb-next'),
      photos: [], alt: '', name: '', idx: 0, lastFocus: null
    };
    lb.closeBtn.addEventListener('click', closeLightbox);
    lb.prev.addEventListener('click', function (){ lbGo(-1); });
    lb.next.addEventListener('click', function (){ lbGo(1); });
    box.addEventListener('click', function (e){ if (e.target === box || e.target === lb.stage) closeLightbox(); });
    lb.dots.addEventListener('click', function (e){
      var d = e.target.closest('.lb-dot'); if (d){ lb.idx = +d.getAttribute('data-i'); lbRender(); }
    });
    var sx = null;
    lb.stage.addEventListener('touchstart', function (e){ sx = e.changedTouches[0].clientX; }, { passive: true });
    lb.stage.addEventListener('touchend', function (e){
      if (sx === null) return;
      var dx = e.changedTouches[0].clientX - sx; sx = null;
      if (Math.abs(dx) > 40) lbGo(dx < 0 ? 1 : -1);
    }, { passive: true });
  }
  function lbRender(){
    lb.img.src = lb.photos[lb.idx] || '';
    lb.img.alt = (lb.alt || lb.name || 'Photo') + ' — photo ' + (lb.idx + 1) + ' of ' + lb.photos.length;
    var multi = lb.photos.length > 1;
    lb.caption.textContent = lb.name + (multi ? '  ·  ' + (lb.idx + 1) + ' / ' + lb.photos.length : '');
    lb.prev.hidden = !multi; lb.next.hidden = !multi;
    if (multi){
      var dotsHtml = '';
      for (var k = 0; k < lb.photos.length; k++){
        dotsHtml += '<button type="button" class="lb-dot' + (k === lb.idx ? ' active' : '') + '" data-i="' + k + '" aria-label="Go to photo ' + (k + 1) + '"></button>';
      }
      lb.dots.innerHTML = dotsHtml;
    } else { lb.dots.innerHTML = ''; }
  }
  function openLightbox(g, start){
    if (!g || !g.photos || !g.photos.length) return;
    buildLightbox();
    lb.photos = g.photos; lb.alt = g.alt; lb.name = g.name; lb.idx = start || 0;
    lb.lastFocus = document.activeElement;
    lbRender();
    lb.el.classList.add('open');
    lb.el.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    document.addEventListener('keydown', lbKey, true);
    lb.closeBtn.focus();
  }
  function closeLightbox(){
    if (!lb) return;
    lb.el.classList.remove('open');
    lb.el.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    document.removeEventListener('keydown', lbKey, true);
    lb.img.src = '';
    if (lb.lastFocus && lb.lastFocus.focus) lb.lastFocus.focus();
  }
  function lbGo(d){
    var n = lb.photos.length; if (!n) return;
    lb.idx = (lb.idx + d + n) % n;
    lbRender();
  }
  function lbKey(e){
    if (e.key === 'Escape'){ e.preventDefault(); closeLightbox(); }
    else if (e.key === 'ArrowLeft'){ lbGo(-1); }
    else if (e.key === 'ArrowRight'){ lbGo(1); }
    else if (e.key === 'Tab'){
      var f = Array.prototype.slice.call(lb.el.querySelectorAll('button')).filter(function (b){ return !b.hidden && b.offsetParent !== null; });
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  }

  /* ---------- interactions (run after content is in the DOM) ---------- */
  function initInteractions(){
    var toggle = el('navToggle');
    var links = el('navlinks');
    if (toggle && links){
      toggle.addEventListener('click', function (){
        var open = links.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open);
        toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      });
      links.querySelectorAll('a').forEach(function (a){
        a.addEventListener('click', function (){
          links.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        });
      });
    }

    var nav = el('nav');
    if (nav){
      var onScroll = function (){ nav.classList.toggle('scrolled', window.scrollY > 8); };
      onScroll();
      window.addEventListener('scroll', onScroll, { passive: true });
    }

    var io = new IntersectionObserver(function (entries){
      entries.forEach(function (e){ if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal').forEach(function (n){ io.observe(n); });

    var openFromCard = function (target){
      var card = target.closest('.show-card[data-gallery]');
      if (card) openLightbox(galleries[card.getAttribute('data-gallery')], 0);
    };
    ['petsGrid', 'childrenGrid'].forEach(function (gid){
      var grid = el(gid);
      if (!grid) return;
      grid.addEventListener('click', function (e){ openFromCard(e.target); });
      grid.addEventListener('keydown', function (e){
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openFromCard(e.target); }
      });
    });

    var form = el('contactForm');
    if (form){
      var fallbackMailto = function (to, subject, name, contact, msg){
        var body = encodeURIComponent('Hi Beverly,\n\n' + msg + '\n\n— ' + name + '\nReach me at: ' + contact);
        window.location.href = 'mailto:' + to + '?subject=' + encodeURIComponent(subject) + '&body=' + body;
      };
      form.addEventListener('submit', function (e){
        e.preventDefault();
        var hp = form.elements['botcheck'];
        if (hp && hp.value) return; // spam honeypot tripped — silently drop
        var key = (form.getAttribute('data-key') || '').trim();
        var to = form.getAttribute('data-email') || '';
        var name = (form.elements['name'].value || '').trim();
        var contact = (form.elements['contact'].value || '').trim();
        var msg = (form.elements['message'].value || '').trim();
        var subject = 'Nanny / pet care inquiry — ' + (name || 'New family');

        // No backend key configured yet -> fall back to the email app.
        if (!key){ fallbackMailto(to, subject, name, contact, msg); return; }

        var btn = form.querySelector('button[type="submit"]');
        var btnHtml = btn ? btn.innerHTML : '';
        if (btn){ btn.disabled = true; btn.textContent = 'Sending…'; }

        var payload = {
          access_key: key,
          subject: subject,
          from_name: "Bev's Nanny & Pet — website",
          name: name,
          message: msg + '\n\nReach me at: ' + contact,
          botcheck: ''
        };
        if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(contact)) payload.email = contact;

        fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(payload)
        })
          .then(function (r){ return r.json(); })
          .then(function (data){
            if (!data || !data.success) throw new Error((data && data.message) || 'Send failed');
            form.innerHTML = '<div class="form-sent">' + ICONS.check +
              '<h3>Message sent!</h3><p>Thanks' + (name ? ', ' + esc(name) : '') +
              ' — your note is on its way to Bev. She&rsquo;ll be in touch soon.</p></div>';
          })
          .catch(function (){
            if (btn){ btn.disabled = false; btn.innerHTML = btnHtml; }
            var note = form.querySelector('.form-note');
            if (note){
              note.style.color = 'var(--blush)';
              note.textContent = "Sorry — that didn't go through. Please call or text Bev, or email " + to + ".";
            }
          });
      });
    }
  }

  function showError(msg){
    var box = el('loadError');
    if (box){ box.style.display = 'block'; box.querySelector('.le-msg').textContent = msg; }
  }

  function render(content){
    renderMeta(content.site || {});
    set('brandText', brandSpan(content.brand || {}));
    renderHero(content.hero || {});
    renderAbout(content.about || {});
    renderServices(content.services || {});
    renderExperience(content.experience || {});
    galleries = {};
    renderChildren(content.children || {});
    renderPets(content.pets || {});
    renderSkills(content.skills || {});
    renderTestimonial(content.testimonial || {});
    renderPayment(content.payment || {});
    renderContact(content.contact || {});
    renderFooter(content.footer || {}, content.brand || {});
    initInteractions();
  }

  function fetchJson(path){
    return fetch(path, { cache: 'no-cache' })
      .then(function (r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (t){ try { return JSON.parse(t); } catch (e){ throw new Error(path + ': ' + e.message); } });
  }
  Promise.all([fetchJson('content.json'), fetchJson('children.json'), fetchJson('pets.json')])
    .then(function (parts){
      var content = parts[0] || {};
      content.children = parts[1] || {};
      content.pets = parts[2] || {};
      try { render(content); }
      catch (err){ console.error('Render error:', err); showError('Something in the content files couldn’t be displayed: ' + err.message); }
    })
    .catch(function (err){
      console.error('Could not load content:', err);
      showError(location.protocol === 'file:'
        ? 'This page reads its text from JSON files (content.json, children.json, pets.json), which browsers block when a file is opened directly. Run a local server (see README.md) or view the published site — both work fine.'
        : 'Could not load the content files (' + err.message + '). Make sure content.json, children.json and pets.json are present and valid.');
    });
})();
</script>
