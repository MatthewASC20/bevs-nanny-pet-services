<!DOCTYPE html>
<!-- Source for ../og-image.jpg (the link-preview card, 1200x630).
     To regenerate: open this file in a browser at exactly 1200x630 and screenshot it,
     or run it through any headless-browser screenshot tool, then save as og-image.jpg.
     It links the real brand fonts, so a machine with network access renders it on-brand. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;}
  body{width:1200px;height:630px;overflow:hidden;
    font-family:'Nunito Sans','Liberation Sans','DejaVu Sans',system-ui,sans-serif;
    background:linear-gradient(150deg,#F1F4EC 0%,#FBF4E4 100%);
    display:grid;grid-template-columns:1.12fr .88fr;align-items:center;gap:40px;padding:0 68px;position:relative;}
  .blobwrap{position:absolute;inset:0;overflow:hidden;}
  .blobwrap svg{position:absolute;right:-60px;top:-40px;width:760px;opacity:.85;}
  .copy{position:relative;z-index:2;}
  .brandrow{display:flex;align-items:center;gap:16px;margin-bottom:30px;}
  .brandrow svg{width:66px;height:66px;flex:none;}
  .bname{font-family:'Baloo 2','Liberation Sans','DejaVu Sans',sans-serif;font-weight:800;font-size:31px;
    color:#21302A;line-height:1.05;letter-spacing:-.02em;}
  .bsub{font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#2C5E43;margin-top:4px;}
  h1{font-family:'Baloo 2','Liberation Sans','DejaVu Sans',sans-serif;font-weight:800;font-size:63px;line-height:1.08;
    color:#21302A;letter-spacing:-.025em;}
  h1 .g{color:#3C7D5A;} h1 .h{color:#CF8E12;}
  p{font-size:23px;color:#4C544C;margin-top:20px;max-width:22ch;line-height:1.45;}
  .chips{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:9px;background:#fff;border:1px solid #E0E6D7;border-radius:999px;
    padding:11px 20px;font-size:17px;font-weight:700;color:#21302A;box-shadow:0 2px 10px rgba(33,48,42,.06);}
  .chip svg{width:19px;height:19px;color:#3C7D5A;}
  .art{position:relative;z-index:2;display:grid;place-items:center;}
  .portrait{width:404px;height:404px;border-radius:50%;overflow:hidden;border:9px solid #fff;
    box-shadow:0 30px 60px -26px rgba(33,48,42,.5);background:#FBF4E4;}
  .portrait img{width:100%;height:100%;object-fit:cover;display:block;}
</style>
</head>
<body>
  <div class="blobwrap">
    <svg viewBox="0 0 480 480" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CFE6D2"/><stop offset="1" stop-color="#F7E3B4"/></linearGradient></defs>
      <path fill="url(#g)" d="M412 286c-20 56-58 104-114 130s-128 30-181-4-83-101-72-160 62-101 122-118 122-12 169 28 76 96 56 152Z"/></svg>
  </div>

  <div class="copy">
    <div class="brandrow">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="2" y="2" width="60" height="60" rx="17" fill="#3C7D5A"/>
        <path d="M22 18V46M22 18H34a7 7 0 0 1 0 14H22M22 32H35a7 7 0 0 1 0 14H22" fill="none" stroke="#FBF4E4" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="translate(41,10) scale(0.32)" fill="#F2B33D"><path d="M16 29C16 29 3 20 3 11C3 6 7 3 11 3C14 3 16 6 16 7C16 6 18 3 21 3C25 3 29 6 29 11C29 20 16 29 16 29Z"/></g>
      </svg>
      <div><div class="bname">Bev&rsquo;s Nanny &amp; Pet</div><div class="bsub">Care services &middot; NYC</div></div>
    </div>
    <h1>Warm, reliable care for your <span class="g">little ones</span> &amp; <span class="h">furry friends</span>.</h1>
    <div class="chips">
      <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-9.3-9A5 5 0 0 1 12 6a5 5 0 0 1 9.3 6c-2.3 4.6-9.3 9-9.3 9Z"/></svg>30+ years of care</span>
      <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>CPR certified</span>
    </div>
  </div>

  <div class="art"><div class="portrait"><img src="../bev-portrait.jpg" alt="Beverly de Jesus"></div></div>
</body>
</html>
